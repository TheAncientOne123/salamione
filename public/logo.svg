    <rect x="7" y="22" width="8" height="18" rx="4"/>
    <rect x="9" y="33" width="14" height="7" rx="3.5"/>
    <rect x="49" y="17" width="8" height="17" rx="4"/>
    <rect x="41" y="27" width="14" height="7" rx="3.5"/>
  </g>
  <!-- cuerpo -->
  <rect x="21" y="12" width="22" height="46" rx="11" fill="#2f9e57"/>
  <rect x="30" y="16" width="4" height="16" rx="2" fill="#3fbf6f" opacity=".7"/>
