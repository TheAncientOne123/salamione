  <rect x="29.5" y="48.3" width="5" height="5" rx="1" fill="none" stroke="#f08a2c" stroke-width="1.4"/>
  <g fill="#7a4a1c"><circle cx="28.5" cy="44" r="1"/><circle cx="35.5" cy="44" r="1"/><circle cx="28.5" cy="56" r="1"/><circle cx="35.5" cy="56" r="1"/></g>
  <!-- cuello levantado -->
  <path d="M20 37 L24 33 L27 37.5 Z M44 37 L40 33 L37 37.5 Z" fill="#b5772f"/>
